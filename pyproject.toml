[project]
name = "davidtimes"
version = "0.1.0"
description = "A personal daily newspaper for the Kindle e-ink browser."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
    "tzdata>=2024.1",
]

[project.scripts]
davidtimes = "davidtimes.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/davidtimes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
